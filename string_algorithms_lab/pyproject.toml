[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "string-algorithms-lab"
version = "0.1.0"
description = "Dependency-free string matching and sequence algorithms"
requires-python = ">=3.10"

[project.scripts]
stringlab = "stringlab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stringlab*"]
