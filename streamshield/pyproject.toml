[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streamshield"
version = "0.1.0"
description = "Bounded-memory event-time analytics primitives"
requires-python = ">=3.11"

[project.scripts]
streamshield = "streamshield.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
