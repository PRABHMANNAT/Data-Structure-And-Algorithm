name: Algorithm workbench
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify algorithms, native bridges, HTTP contracts, and browser models
        # GraphForge and StreamShield use pytest; runtime projects remain dependency-free.
        run: python -m pip install pytest
      - name: Run complete verification
        run: python scripts/verify.py
