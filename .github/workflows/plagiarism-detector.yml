name: Plagiarism detector tests

on:
  push:
    paths:
      - 'plagiarism_detection_system/**'
      - '.github/workflows/plagiarism-detector.yml'
  pull_request:
    paths:
      - 'plagiarism_detection_system/**'
      - '.github/workflows/plagiarism-detector.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        working-directory: plagiarism_detection_system
        run: python -m unittest discover -s tests -v
